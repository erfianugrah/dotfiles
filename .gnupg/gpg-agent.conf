# Cache passphrases long enough for headless consumers (tmux loops, pi -p
# subagents, CI-adjacent shells) to sign without a TTY. One interactive
# unlock covers a month of commits; re-prompt after 7d of total inactivity.
# default-cache-ttl: seconds since last use before re-prompt
# max-cache-ttl:     hard upper bound on how long a cached passphrase lives
default-cache-ttl       604800
max-cache-ttl           2592000
default-cache-ttl-ssh   604800
max-cache-ttl-ssh       2592000

# Sensible pinentry behaviour
allow-preset-passphrase
pinentry-program /opt/homebrew/bin/pinentry-mac
